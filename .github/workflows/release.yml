name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build distributable assets
        run: ./tools/build-distributions.sh

      - name: Create latest alias assets
        run: |
          shopt -s nullglob
          assets=(dist/*.zip dist/*.tar.gz)
          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            alias="$name"
            case "$name" in
              *.tar.gz)
                stem="${name%.tar.gz}"
                ext=".tar.gz"
                ;;
              *.zip)
                stem="${name%.zip}"
                ext=".zip"
                ;;
              *)
                continue
                ;;
            esac
            alias_stem="$(printf '%s' "$stem" | sed -E 's/-v[0-9][0-9A-Za-z._-]*$//')"
            alias="${alias_stem}${ext}"
            if [ "$alias" != "$name" ]; then
              cp "$asset" "dist/$alias"
            fi
          done

      - name: Verify release assets
        run: |
          shopt -s nullglob
          assets=(dist/*.zip dist/*.tar.gz)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were generated in dist/." >&2
            exit 1
          fi
          printf 'Assets to publish:\n'
          printf ' - %s\n' "${assets[@]}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          assets=(dist/*.zip dist/*.tar.gz)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              "${assets[@]}"
          fi
