name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build distributable assets
        run: ./tools/build-distributions.sh

      - name: Verify release assets
        run: |
          shopt -s nullglob
          assets=(dist/*.zip)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No ZIP assets were generated in dist/." >&2
            exit 1
          fi
          printf 'Assets to publish:\n'
          printf ' - %s\n' "${assets[@]}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          assets=(dist/*.zip)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              "${assets[@]}"
          fi
